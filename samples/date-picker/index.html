<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>今日のデート決め</title>
<style>
:root{--ink:#28231f;--sub:#73695f;--orange:#ff7a3d;--cream:#fff8ef;--line:#f0dfcf}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:linear-gradient(180deg,#fff6e9,#fffdf9);color:var(--ink);min-height:100vh}.wrap{width:min(100%,650px);margin:auto;padding:20px 18px 50px}.brand{font-size:13px;font-weight:800;color:#c45d2c;letter-spacing:.08em}.hero{text-align:center;padding:28px 0}.hero .emoji{font-size:52px}.hero h1{font-size:clamp(34px,9vw,55px);line-height:1.08;margin:8px 0 12px}.hero p{color:var(--sub);line-height:1.8}.card{background:#fff;border:1px solid var(--line);border-radius:28px;padding:22px;box-shadow:0 18px 50px rgba(109,66,24,.08)}.step{margin:0 0 22px}.step strong{display:block;margin-bottom:10px}.choices{display:flex;flex-wrap:wrap;gap:9px}.choices button{border:1px solid var(--line);background:#fffaf4;border-radius:999px;padding:10px 14px;color:#695d52;font-weight:700}.choices button.active{background:#ffede1;border-color:#ff9f70;color:#b54e20}.main{width:100%;border:0;border-radius:18px;padding:17px;background:linear-gradient(135deg,#ff783a,#ffab5f);color:#fff;font-size:16px;font-weight:900;box-shadow:0 12px 26px rgba(255,122,61,.25)}.result{display:none}.result-card{padding:8px 0}.badge{display:inline-block;border-radius:99px;background:#fff0e4;color:#c85b29;padding:7px 11px;font-size:12px;font-weight:800}.result h2{font-size:30px;margin:14px 0 8px}.result p{color:var(--sub);line-height:1.8}.plan{display:grid;gap:10px;margin:20px 0}.item{display:grid;grid-template-columns:46px 1fr;gap:12px;align-items:center;border:1px solid var(--line);background:#fffaf5;border-radius:18px;padding:13px}.item b{display:grid;place-items:center;width:46px;height:46px;border-radius:15px;background:#ffe7d6;font-size:22px}.item strong{display:block}.item small{color:#8e8074}.subbtn{background:#fff;color:#bd5427;border:1px solid #ffc09e;margin-top:10px}.shake{animation:shake .4s}@keyframes shake{25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}.mini{text-align:center;font-size:11px;color:#a18f80;margin-top:12px}
</style></head><body><div class="wrap"><div class="brand">SAMPLE APP 02</div><section class="hero"><div class="emoji">🧡</div><h1>今日の<br>デート決め</h1><p>「何する？」で止まったらこれ。<br>予算・時間・気分から今日のプランを1つ決めます。</p></section>
<div class="card" id="form">
<div class="step"><strong>💰 予算</strong><div class="choices" data-key="budget"><button data-v="low">〜3,000円</button><button data-v="mid">〜8,000円</button><button data-v="high">ちょっと贅沢</button></div></div>
<div class="step"><strong>⏰ 使える時間</strong><div class="choices" data-key="time"><button data-v="short">2〜3時間</button><button data-v="half">半日</button><button data-v="full">1日</button></div></div>
<div class="step"><strong>🎈 今日の気分</strong><div class="choices" data-key="mood"><button data-v="relax">まったり</button><button data-v="active">遊びたい</button><button data-v="food">食べたい</button><button data-v="new">新しいこと</button></div></div>
<button class="main" id="go">今日のデートを決める 🎲</button><div class="mini">迷ったら「もう一回」で何度でも候補を出せます</div></div>
<div class="card result" id="result"><div class="result-card"><span class="badge" id="badge"></span><h2 id="title"></h2><p id="desc"></p><div class="plan" id="plan"></div><button class="main" id="again">別のプランを見る 🎲</button><button class="main subbtn" onclick="location.reload()">条件を変える</button></div></div>
</div><script>
let s={};document.querySelectorAll(".choices").forEach(g=>g.querySelectorAll("button").forEach(b=>b.onclick=()=>{s[g.dataset.key]=b.dataset.v;g.querySelectorAll("button").forEach(x=>x.classList.remove("active"));b.classList.add("active")}));
const plans=[
{t:"カフェはしご＋夜さんぽ",m:["relax","food"],b:["low","mid"],tm:["half","full"],d:"気になるカフェを2軒だけ巡って、最後はのんびり夜さんぽ。話す時間をたっぷり取れる定番プラン。",p:[["☕","1軒目","気になっていたカフェへ"],["🍰","2軒目","デザートをシェア"],["🌙","最後","景色のいい場所を散歩"]]},
{t:"食べ歩きミッション",m:["food","active"],b:["low","mid"],tm:["half","full"],d:"エリアを1つ決めて、気になったものを3つ食べるだけ。予定を決めすぎないから気楽。",p:[["🥟","MISSION 1","しょっぱいもの"],["🍓","MISSION 2","甘いもの"],["📷","MISSION 3","今日のベスト1を決める"]]},
{t:"おうち映画＋買い出し",m:["relax"],b:["low"],tm:["short","half"],d:"スーパーで食べたいものを1人1個ずつ選んで、おうち映画。低予算でも満足度高め。",p:[["🛒","買い出し","1人1個ずつ好きなもの"],["🎬","映画","ジャンルだけ決めて選ぶ"],["🍨","締め","アイスで感想会"]]},
{t:"体験型デートに挑戦",m:["new","active"],b:["mid","high"],tm:["half","full"],d:"陶芸、ボルダリング、謎解き、ワークショップなど『一緒に初めて』を作る日。",p:[["🎯","選ぶ","未経験のものを1つ"],["🙌","体験","勝負より楽しむ"],["🍽️","振り返り","ごはんを食べながら感想"]]},
{t:"ちょっと贅沢ホテルデート",m:["relax","new"],b:["high"],tm:["half","full"],d:"ホテルラウンジやアフタヌーンティーで、いつもより少し特別な時間に。",p:[["🏨","到着","ラウンジでゆっくり"],["🫖","メイン","アフタヌーンティー"],["✨","最後","次に行きたい場所を相談"]]},
{t:"ミニドライブ＋ご当地ごはん",m:["active","food","new"],b:["mid","high"],tm:["full"],d:"目的地を1つだけ決めて、あとは寄り道OK。移動中の会話も楽しめる1日プラン。",p:[["🚗","出発","片道1〜2時間の場所へ"],["📍","寄り道","気になった場所に1回停車"],["🍜","ごはん","現地で人気のものを食べる"]]}
];
function choose(){let a=plans.filter(x=>(!s.mood||x.m.includes(s.mood))&&(!s.budget||x.b.includes(s.budget))&&(!s.time||x.tm.includes(s.time)));if(!a.length)a=plans;let p=a[Math.floor(Math.random()*a.length)];document.querySelector("#badge").textContent="TODAY'S DATE PLAN";document.querySelector("#title").textContent=p.t;document.querySelector("#desc").textContent=p.d;document.querySelector("#plan").innerHTML=p.p.map(x=>"<div class='item'><b>"+x[0]+"</b><div><strong>"+x[1]+"</strong><small>"+x[2]+"</small></div></div>").join("");document.querySelector("#form").style.display="none";let r=document.querySelector("#result");r.style.display="block";r.classList.remove("shake");void r.offsetWidth;r.classList.add("shake");scrollTo({top:0,behavior:"smooth"})}
document.querySelector("#go").onclick=()=>{if(!s.budget||!s.time||!s.mood){alert("3つとも選んでね！");return}choose()};document.querySelector("#again").onclick=choose;
</script></body></html>
