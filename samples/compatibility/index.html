<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ふたりの相性診断</title>
<style>
:root{--bg:#fff7fb;--card:#fff;--ink:#2b2230;--sub:#7b6b79;--pink:#ff5f9e;--pink2:#ff8fbe;--line:#f0dfe8}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:radial-gradient(circle at top,#ffeaf4,#fff9fc 45%,#fff);color:var(--ink);min-height:100vh}
.wrap{width:min(100%,620px);margin:auto;padding:22px 18px 50px}.brand{font-weight:800;font-size:14px;letter-spacing:.08em;color:#bb4d7f}.hero{text-align:center;padding:28px 0 20px}.hero h1{font-size:clamp(34px,9vw,56px);line-height:1.08;margin:10px 0}.hero p{color:var(--sub);line-height:1.8}
.card{background:#fff;border:1px solid var(--line);border-radius:28px;padding:22px;box-shadow:0 18px 50px rgba(120,40,80,.09)}label{display:block;font-size:13px;font-weight:700;margin:14px 0 7px}input{width:100%;padding:15px 16px;border:1px solid var(--line);border-radius:16px;font-size:16px;background:#fffafd}
.q{margin-top:22px}.q strong{display:block;margin-bottom:10px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px}.opts button{border:1px solid var(--line);background:#fff;border-radius:15px;padding:12px;font-weight:700;color:#685863}.opts button.active{background:#ffe5f0;border-color:#ff89b8;color:#a83d6d}
.main{width:100%;border:0;border-radius:18px;padding:16px;font-weight:800;font-size:16px;background:linear-gradient(135deg,var(--pink),var(--pink2));color:#fff;margin-top:22px;box-shadow:0 12px 26px rgba(255,95,158,.25)}
.result{display:none;text-align:center;padding:30px 8px 8px}.score{font-size:80px;font-weight:900;line-height:1;background:linear-gradient(135deg,#ff4e96,#ff9fc8);-webkit-background-clip:text;color:transparent}.heart{font-size:44px}.bar{height:14px;background:#f6e8ef;border-radius:20px;overflow:hidden;margin:20px 0}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff6aa8,#ffb2d0);transition:1s}.result h2{font-size:24px}.result p{color:var(--sub);line-height:1.8}.tags{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}.tags span{background:#fff0f6;border:1px solid #ffd1e3;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:700}.again{background:#fff;color:#b34476;border:1px solid #ffc9df}.tiny{text-align:center;color:#a18f9c;font-size:11px;margin-top:14px}
</style></head><body><div class="wrap"><div class="brand">SAMPLE APP 01</div><section class="hero"><div>💗</div><h1>ふたりの<br>相性診断</h1><p>5つの質問に答えるだけ。<br>ふたりの相性と関係タイプを診断します。</p></section>
<div class="card" id="form"><label>あなたの名前</label><input id="a" placeholder="例：あお"><label>相手の名前</label><input id="b" placeholder="例：ゆき">
<div id="questions"></div><button class="main" id="go">相性を診断する 💞</button><div class="tiny">※エンタメ用の簡易診断です</div></div>
<div class="card result" id="result"><div class="heart">💘</div><div class="score"><span id="score">88</span>%</div><div class="bar"><i id="bar"></i></div><h2 id="title"></h2><p id="desc"></p><div class="tags" id="tags"></div><button class="main again" onclick="location.reload()">もう一度診断する</button></div>
</div><script>
const qs=[["休日は？","外に出たい","家でゆっくり"],["予定は？","しっかり決めたい","その場で決めたい"],["連絡は？","こまめが好き","必要な時でOK"],["食事は？","新しい店を開拓","お気に入り重視"],["ケンカしたら？","すぐ話したい","少し時間がほしい"]];
const box=document.querySelector("#questions");let ans=[];
qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML="<strong>Q"+(i+1)+" "+q[0]+"</strong><div class='opts'><button>"+q[1]+"</button><button>"+q[2]+"</button></div>";d.querySelectorAll("button").forEach((btn,j)=>btn.onclick=()=>{ans[i]=j;d.querySelectorAll("button").forEach(x=>x.classList.remove("active"));btn.classList.add("active")});box.appendChild(d)});
document.querySelector("#go").onclick=()=>{const a=document.querySelector("#a").value.trim()||"あなた";const b=document.querySelector("#b").value.trim()||"相手";if(ans.filter(x=>x!==undefined).length<5){alert("5問すべて答えてね！");return}let seed=[...a+b].reduce((n,c)=>n+c.charCodeAt(0),0);let balance=ans.reduce((n,x,i)=>n+(x===((seed+i)%2)?5:2),0);let score=Math.min(99,68+balance+(seed%7));let title,desc,tags;if(score>=92){title="シンクロ率MAXタイプ";desc=a+"さんと"+b+"さんは、テンポも価値観もかなり噛み合いやすい組み合わせ。自然体のまま一緒に楽しめる関係です。";tags=["空気感◎","一緒にいてラク","長く続きやすい"]}else if(score>=84){title="バランス最強タイプ";desc="似ているところと違うところのバランスがちょうどいいふたり。違いも楽しめるのが強みです。";tags=["相互補完","会話が続く","刺激も安心も"]}else{title="じわじわ深まるタイプ";desc="最初から全部同じではないからこそ、知れば知るほど面白くなる関係。歩幅を合わせるほど相性アップ。";tags=["伸びしろ大","発見が多い","じっくり型"]}document.querySelector("#form").style.display="none";const r=document.querySelector("#result");r.style.display="block";document.querySelector("#score").textContent=score;document.querySelector("#title").textContent=title;document.querySelector("#desc").textContent=desc;document.querySelector("#tags").innerHTML=tags.map(x=>"<span>"+x+"</span>").join("");setTimeout(()=>document.querySelector("#bar").style.width=score+"%",100);scrollTo({top:0,behavior:"smooth"})};
</script></body></html>
